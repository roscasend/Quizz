services:
  quiz-postgres:
    image: postgres:16-alpine
    container_name: quiz-postgres
    environment:
      POSTGRES_DB: quiz_service
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
    ports:
      - "5433:5432"
    volumes:
      - quiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d quiz_service"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  quiz_postgres_data:
